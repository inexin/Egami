<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="10" height="10"><animate id="x" attributeName="width" by="2" begin="y.begin;0" dur="10ms" repeatCount="1e6" accumulate="sum"/><animate id="y" attributeName="height" to="20" begin="x.begin-1s;z.end" dur="1ms"/><animate id="z" attributeName="x" from="1" to="2" begin="y.end;x.repeat(3)+0.002s" end="x.end;wallclock(2026-01-01)" dur="indefinite" restart="never"/></rect></svg>
