<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32">
  <style>
    @keyframes a { to { opacity: 0.5; transform: scale(2) } }
    rect { animation: a 1e12s steps(2147483647, jump-both) }
    circle { animation: a 1s linear 1e300 alternate-reverse }
  </style>
  <rect width="10" height="10"/>
  <circle cx="20" cy="20" r="5"/>
</svg>
