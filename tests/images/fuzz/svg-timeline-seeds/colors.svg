<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"><style>.k { fill: green }</style><rect class="k" width="30" height="30" fill="red"><animate attributeName="fill" from="red" to="rgba(0,0,255,0.5)" dur="2s"/><animate attributeName="stroke" values="none;red;url(#g)" dur="1s" calcMode="discrete" keyTimes="0;0.2;0.7"/><animate attributeName="stroke-width" from="1in" to="5mm" dur="1s"/><animate attributeName="font-size" from="10%" to="2em" dur="1s"/></rect></svg>
