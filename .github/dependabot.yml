# Weekly update pull requests for the GitHub Actions the workflows use and the NuGet packages in Directory.Packages.props
# (test, benchmark and build-time packages; src/ references none but the public API analyzer). Each ecosystem's updates come
# in one grouped pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # Egami.Cli.Generators is a source generator: built on a newer Roslyn it won't load in the older compilers that
      # global.json still allows (SDK 10.0.100 and later), so its Roslyn version stays low on purpose.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
        update-types: ['version-update:semver-major']
