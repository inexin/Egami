# Weekly update pull requests for the GitHub Actions the workflows use and the NuGet packages in Directory.Packages.props
# (test, benchmark and build-time packages; src/ references none but the public API analyzer). Each ecosystem's updates come
# in one grouped pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # Egami.Cli.Generators is a source generator: built on a newer Roslyn than the compiler running it, it won't load.
      # Its Roslyn version stays below the compiler in the oldest SDK that global.json allows, on purpose.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
        update-types: ['version-update:semver-major']
