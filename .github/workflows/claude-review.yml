name: Claude review

# Claude reviews each pull request when it is opened, updated, reopened or marked ready, and posts its findings as inline
# comments. It reads CLAUDE.md, which includes AGENTS.md, so it checks the clean-room and managed-only rules too. Each push
# reviews the pull request again: Claude resolves its own threads that the new code fixes and doesn't repeat open ones.
# Findings are advice: the job never fails a pull request. Pull requests from forks are skipped, because GitHub withholds the
# secret there.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Claude Code refuses allow rules for commands with quotes, braces and $ in them, so the thread queries live in this
      # small command, which takes plain arguments and is written here from the workflow, not from the pull request.
      - name: Add the review-threads command
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/review-threads" <<'EOF'
          #!/usr/bin/env bash
          # review-threads list          prints Claude's unresolved review threads on this pull request, one JSON object each
          # review-threads resolve ID    resolves one of them
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%/*}
          repo=${GITHUB_REPOSITORY#*/}
          pr=PR_NUMBER
          threads() {
            gh api graphql \
              -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewThreads(first:100){nodes{id isResolved comments(first:1){nodes{author{login} path line body}}}}}}}' \
              -f owner="$owner" -f repo="$repo" -F pr="$pr" \
              --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select((.isResolved | not) and .comments.nodes[0].author.login == "claude") | {id, path: .comments.nodes[0].path, line: .comments.nodes[0].line, body: .comments.nodes[0].body}'
          }
          case "${1:-}" in
            list) threads ;;
            resolve)
              id=${2:?usage: review-threads resolve THREAD_ID}
              if ! threads | jq -e --arg id "$id" 'select(.id == $id)' > /dev/null; then
                echo "$id is not an unresolved Claude thread on this pull request" >&2
                exit 1
              fi
              gh api graphql -f query='mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{isResolved}}}' -f id="$id" \
                --jq '"resolved: \(.data.resolveReviewThread.thread.isResolved)"' ;;
            *) echo "usage: review-threads list | review-threads resolve THREAD_ID" >&2; exit 2 ;;
          esac
          EOF
          sed -i "s/^pr=PR_NUMBER$/pr=$PR_NUMBER/" "$RUNNER_TEMP/bin/review-threads"
          chmod +x "$RUNNER_TEMP/bin/review-threads"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          # The Claude Code report in the job summary shows what Claude ran, including any command it was refused.
          display_report: true
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            This workflow runs again on every push to the pull request, so this may be a re-review. Change the steps above
            as follows:
            - In step 1, ignore the condition that Claude has already commented. Still stop for a closed or draft pull request.
            - Before step 4, run `review-threads list`. It prints each unresolved review thread that Claude started, with its
              id, path, line and comment. For each one, read the current code. If the issue is fixed, run
              `review-threads resolve THREAD_ID` with the thread's id. Leave a thread open when the issue is still there.
              Run these commands yourself, not in a subagent.
            - Don't post a new comment for an issue that an unresolved thread already covers.
            - If no new issues are found and the pull request already has a "No issues found" comment from Claude, post
              nothing.

            Nobody can approve a command in this run, so a command that needs approval is refused. Run each command on its
            own: no `cd`, no `&&` or `;`, and keep any file you save inside the working directory, not in /tmp. You and
            every subagent may run `gh pr view`, `gh pr diff`, `gh pr comment`, `gh pr list`, `gh issue view`,
            `gh issue list`, `gh search`, `head`, `tail`, `wc` and `grep`.
            If you still can't finish the review, because a command was refused or a step failed, don't end silently:
            post a comment with `gh pr comment` that starts with "## Code review" and says the review did not complete
            and why.
          # The code-review command allows its gh commands only for its own step, and a chained command such as
          # `cd /tmp && gh pr diff ... > file && wc -l file` was refused on large pull requests, which then got no comment.
          # These rules apply to the whole run, subagents included.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(review-threads list),Bash(review-threads resolve:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*)"
