name: Release

# A tag v<version>, the shared version of the Egami release train (EgamiVersion in Directory.Build.props), publishes its seven
# packages: Egami, Egami.Drawing, Egami.Fonts, Egami.Svg, Egami.Css, Egami.Heic and Egami.Cli, all at that version. A tag
# <package>-v<version>, for example Egami.Barcodes-v1.0.1, publishes that one package, which must be at that version; that is
# how the packages with their own version release: Egami.Barcodes, Egami.Metafiles, Egami.Fonts.Substitutes and Egami.Video,
# as Egami.Barcodes-v1.0.0 did. The push uses nuget.org trusted publishing: NuGet/login trades the job's OIDC token for a
# short-lived API key, so the repository keeps no NuGet key. The trusted publishing policy on nuget.org names this repository,
# this workflow file and the nuget environment, and the nuget environment requires Lars's approval before the job starts.
# The secret NUGET_USER is the nuget.org account name. After the NuGet push, a v* tag also builds the egami command as a
# native program for win-x64, linux-x64 and osx-arm64 and attaches the three to a GitHub release named after the tag.

on:
  push:
    tags: ['v*', 'Egami.*-v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack and publish to NuGet
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # the OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Pick the packages from the tag
        run: |
          case "$GITHUB_REF_NAME" in
            v*) project=Egami; packages="Egami Egami.Drawing Egami.Fonts Egami.Svg Egami.Css Egami.Heic Egami.Cli"; tag_version=${GITHUB_REF_NAME#v} ;;
            *-v*) project=${GITHUB_REF_NAME%-v*}; packages=$project; tag_version=${GITHUB_REF_NAME##*-v} ;;
          esac
          if [ ! -f "src/$project/$project.csproj" ]; then
            echo "::error::Tag $GITHUB_REF_NAME names no package in src"
            exit 1
          fi
          version=$(dotnet msbuild "src/$project/$project.csproj" -getProperty:Version)
          if [ "$version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $project $version"
            exit 1
          fi
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
      - name: Build and test
        run: dotnet test Egami.slnx -c Release
      # UseReleasedDependencies builds a package that opts in (Egami.Barcodes) against the released versions of the packages
      # it needs, so it installs with what is on nuget.org; the others ignore it.
      - name: Pack
        run: |
          for package in $PACKAGES; do
            dotnet pack "src/$package" -c Release -o artifacts/nuget -p:UseReleasedDependencies=true
          done
      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: artifacts/nuget
      - name: Sign in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  # A release-train tag (v*) also gets a GitHub release with the egami command as a native program for Windows, Linux and
  # macOS, which needs no .NET runtime. It runs only after the NuGet job, so Lars's approval of that job covers it too.
  native:
    name: egami native (${{ matrix.rid }})
    needs: publish
    if: startsWith(github.ref_name, 'v')
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            exe: egami.exe
          - rid: linux-x64
            os: ubuntu-latest
            exe: egami
          - rid: osx-arm64
            os: macos-latest
            exe: egami
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish
        run: dotnet publish src/Egami.Cli -c Release -r ${{ matrix.rid }} -p:EgamiNativeAot=true -o artifacts/native
      - name: Check it runs and pack it
        shell: bash
        run: |
          tool=artifacts/native/${{ matrix.exe }}
          "$tool" --version
          "$tool" info tests/images/jpeg/duck-420.jpg
          mkdir -p artifacts/release
          name="egami-${GITHUB_REF_NAME#v}-${{ matrix.rid }}"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            (cd artifacts/native && 7z a "../release/$name.zip" egami.exe)
          else
            tar -czf "artifacts/release/$name.tar.gz" -C artifacts/native egami
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: egami-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: egami-*
          path: release
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Egami ${GITHUB_REF_NAME#v}" \
            --notes "Egami, Egami.Drawing, Egami.Fonts, Egami.Svg, Egami.Css, Egami.Heic and Egami.Cli ${GITHUB_REF_NAME#v} are on NuGet. The files here are the egami command as a native program that needs no .NET runtime: unpack it and run egami --help. CHANGELOG.md lists what changed."
