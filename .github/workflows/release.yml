name: Release

# A tag v<version>, the version of src/Egami, publishes the 1.0 packages: Egami, Egami.Drawing, Egami.Fonts, Egami.Svg and
# Egami.Css, each at the version in its own project file. Egami.Metafiles is 0.x and stays out. The push uses nuget.org trusted
# publishing: NuGet/login trades the job's OIDC token for a short-lived API key, so the repository keeps no NuGet key. The
# trusted publishing policy on nuget.org names this repository, this workflow file and the nuget environment, and the nuget
# environment requires Lars's approval before the job starts. The secret NUGET_USER is the nuget.org account name.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack and publish to NuGet
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # the OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Check the tag against Egami's version
        run: |
          version=$(dotnet msbuild src/Egami/Egami.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Egami $version"
            exit 1
          fi
      - name: Build and test
        run: dotnet test Egami.slnx -c Release
      - name: Pack
        run: |
          for package in Egami Egami.Drawing Egami.Fonts Egami.Svg Egami.Css; do
            dotnet pack "src/$package" -c Release --no-build -o artifacts/nuget
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget
      - name: Sign in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
