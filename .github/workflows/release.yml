name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Pack and publish to NuGet
    runs-on: ubuntu-latest
    # The nuget environment requires Lars's approval before this job starts.
    environment: nuget
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Pack
        run: dotnet pack src/Egami -c Release -o artifacts/nuget -p:Version="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget
      - name: Publish
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
