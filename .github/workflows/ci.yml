name: CI

# Pull requests run the Linux x64 build and tests and the checks. Pushes to main, the nightly run and manual runs add the other
# platforms, the tests with hardware intrinsics turned off, libpng and the Native AOT smoke app.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-linux:
    name: Build and test (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Egami.slnx -c Release
      - run: dotnet test Egami.slnx -c Release --no-build

  build-test:
    name: Build and test (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Egami.slnx -c Release
      - run: dotnet test Egami.slnx -c Release --no-build

  simd-fallbacks:
    # Runs the tests with each level of hardware intrinsics turned off, so every SIMD fallback path is covered.
    name: Tests without ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: AVX-512, var: DOTNET_EnableAVX512F }
          - { name: AVX2, var: DOTNET_EnableAVX2 }
          - { name: hardware intrinsics, var: DOTNET_EnableHWIntrinsic }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Egami.slnx -c Release
      - run: env "${{ matrix.var }}=0" dotnet test Egami.slnx -c Release --no-build

  checks:
    name: Format, API and dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Format
        run: dotnet format Egami.slnx --verify-no-changes
      # The public API baseline (PublicAPI.*.txt) and the analyzers run as part of this build; warnings are errors.
      - name: Build (analyzers and public API baseline)
        run: dotnet build Egami.slnx -c Release
      - name: Docs complete
        run: |
          for package in src/*/; do
            python3 tools/check-docs.py "$package"
          done
      - name: No package references in src/
        run: |
          # Only build-time analyzers are allowed, plus the approved packages in docs/references.md: System.CommandLine and the
          # MCP SDK (ModelContextProtocol.Core, for egami mcp, with the three abstractions packages it brings) in the egami and
          # egami-video tools (apps, not libraries). The tool's source generator runs at build time only and is never packed.
          # Anything else would ship as a dependency.
          allowed='Microsoft.CodeAnalysis.PublicApiAnalyzers'
          status=0
          for proj in $(find src -name '*.csproj'); do
            case "$proj" in
              src/Egami.Cli.Generators/*) continue ;;
              src/Egami.Cli/*|src/Egami.Video.Cli/*) extra=$'System.CommandLine\nModelContextProtocol.Core\nMicrosoft.Extensions.AI.Abstractions\nMicrosoft.Extensions.DependencyInjection.Abstractions\nMicrosoft.Extensions.Logging.Abstractions' ;;
              *) extra='' ;;
            esac
            for pkg in $(dotnet list "$proj" package --include-transitive --format json \
                         | jq -r '.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[] | select(.autoReferenced != "true") | .id'); do
              if ! grep -qxF "$pkg" <<< "$allowed"$'\n'"$extra"; then
                echo "::error file=$proj::Package reference '$pkg' is not allowed in src/"
                status=1
              fi
            done
          done
          exit $status
      # Egami.Barcodes is packed against the released Egami, Egami.Drawing and Egami.Fonts (UseReleasedDependencies); this
      # fails when it starts to need something newer than those, before a release would ship a package that cannot load.
      - name: Egami.Barcodes against the released packages
        run: dotnet build src/Egami.Barcodes -c Release -p:UseReleasedDependencies=true

  libpng:
    # Checks Egami's PNG reader and writer against libpng, the reference PNG library. libpng is a CI test tool only.
    name: PNG against libpng
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install libpng and pngcheck
        run: sudo apt-get update && sudo apt-get install -y libpng-dev pngcheck
      - name: Build the libpng decoder
        run: gcc -O2 -Wall -Werror -o "$RUNNER_TEMP/pngdecode" tools/libpng-check/pngdecode.c -lpng
      - run: dotnet build tests/Egami.Tests -c Release
      - name: Compare with libpng
        run: dotnet test tests/Egami.Tests -c Release --no-build --filter "FullyQualifiedName~LibpngTests"
        env:
          EGAMI_LIBPNG_DECODER: ${{ runner.temp }}/pngdecode
          EGAMI_PNGCHECK: pngcheck
          EGAMI_REQUIRE_LIBPNG: '1'

  aot-smoke:
    name: Native AOT smoke app
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Warnings are errors, so any trim or AOT warning fails the publish.
      - run: dotnet publish tests/Egami.AotSmoke -c Release -r linux-x64 -o artifacts/aot
      - run: ./artifacts/aot/Egami.AotSmoke
