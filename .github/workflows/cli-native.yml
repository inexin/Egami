# Builds the egami and egami-video commands as native programs (Native AOT, no .NET runtime needed) for win-x64, linux-x64
# and osx-arm64, checks that each one runs, and keeps them as the run's artifacts. It publishes nothing: no release, no tag,
# no NuGet. Like the extra platforms and the Native AOT smoke app in ci.yml, it runs on pushes to main and by hand, not on
# pull requests; release.yml builds the binaries that ship.
name: CLI native builds

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/cli-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-native-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  native:
    name: egami and egami-video (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            exe: egami.exe
            video: egami-video.exe
          - rid: linux-x64
            os: ubuntu-latest
            exe: egami
            video: egami-video
          - rid: osx-arm64
            os: macos-latest
            exe: egami
            video: egami-video
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Warnings are errors, so any trim or AOT warning fails the publish.
      - name: Publish
        run: dotnet publish src/Egami.Cli -c Release -r ${{ matrix.rid }} -p:EgamiNativeAot=true -o artifacts/egami-${{ matrix.rid }}
      - name: Check it runs
        shell: bash
        run: |
          tool=artifacts/egami-${{ matrix.rid }}/${{ matrix.exe }}
          "$tool" --version
          "$tool" info tests/images/jpeg/duck-420.jpg
          "$tool" thumbnail tests/images/jpeg/duck-420.jpg -o artifacts/thumb.webp --size 64
          "$tool" info artifacts/thumb.webp
      - uses: actions/upload-artifact@v7
        with:
          name: egami-${{ matrix.rid }}
          path: artifacts/egami-${{ matrix.rid }}/${{ matrix.exe }}
          if-no-files-found: error
      # egami-video is AOT-clean from its first release (Video CLI design Q11); its binaries ship with Egami.Video 1.0.
      - name: Publish egami-video
        run: dotnet publish src/Egami.Video.Cli -c Release -r ${{ matrix.rid }} -p:EgamiNativeAot=true -o artifacts/egami-video-${{ matrix.rid }}
      - name: Check egami-video runs
        shell: bash
        run: |
          tool=artifacts/egami-video-${{ matrix.rid }}/${{ matrix.video }}
          "$tool" --version
          "$tool" info tests/video/corpus/avi-mjpeg-420-pcm.avi --all
          "$tool" remux tests/video/corpus/avi-mjpeg-420-pcm.avi -o artifacts/remux.mkv
          "$tool" frames artifacts/remux.mkv --count 2 -o artifacts/frame-{frame}.png
          "$tool" info artifacts/remux.mkv
      - uses: actions/upload-artifact@v7
        with:
          name: egami-video-${{ matrix.rid }}
          path: artifacts/egami-video-${{ matrix.rid }}/${{ matrix.video }}
          if-no-files-found: error
